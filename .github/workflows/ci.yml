name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    name: browser (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm run test:browser:install

      # On a cache hit the browser binaries are restored, but the OS packages
      # they need are not, so install those separately.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Run browser smoke tests
        run: npm run test:browser

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check (lint + format + imports)
        run: npm run check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run benchmarks (verify clean exit)
        if: matrix.node-version == 24
        run: npm run bench

      - name: Build package
        if: matrix.node-version == 24
        run: npm run build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build package (no upload)
        if: matrix.node-version != 24
        run: npm run build

      - name: Upload coverage to Codecov
        if: matrix.node-version == 24
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/cobertura-coverage.xml
          disable_search: true
          # Coverage reporting only — the 100% threshold is already enforced by
          # the test:coverage step (vitest). Do not fail CI on transient Codecov
          # upload/verification errors.
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: matrix.node-version == 24 && !cancelled()
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results/junit.xml
          report_type: test_results
          disable_search: true
          # Reporting only — never fail CI on a transient Codecov upload error.
          fail_ci_if_error: false
