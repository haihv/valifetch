name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache in the release job: a restored cache is an
          # input this job cannot vouch for, and it publishes with OIDC.

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # npm trusted publishing with staged releases: npm exchanges this job's
      # OIDC token (id-token: write) for a short-lived token, so no NPM_TOKEN
      # secret is needed. The trusted publisher on npmjs.com (haihv/valifetch,
      # publish.yml) may only stage, so the version is not public until a
      # maintainer approves it with 2FA: `npm stage list valifetch`, then
      # `npm stage approve <stage-id>`, or on npmjs.com. Provenance is
      # attached automatically. npm is pinned because `npm stage` is newer
      # than the npm bundled with some Node 24 releases.
      - name: Update npm
        run: npm install -g npm@11.21.2

      - name: Stage npm release
        run: npm stage publish --access public

      - name: Publish to JSR
        run: npx jsr publish --allow-dirty

      - name: Extract changelog for release
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          # Extract the section between this version header and the next
          NOTES=$(awk "/^## \[${VERSION#v}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          # Append npm link
          NOTES="${NOTES}

          ---
          Published to npm: https://www.npmjs.com/package/valifetch/v${VERSION#v}"
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
